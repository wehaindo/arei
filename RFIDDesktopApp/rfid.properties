# RFID WebSocket Application Configuration - POS Mode

# WebSocket Server Settings
ws.port=8081

# Scanning Settings
scan.interval.ms=200

# Cache Settings (prevents memory leak)
# Maximum number of unique tags to remember before evicting oldest
cache.max.tags=10000

# Tag Processing Settings
# Minimum length for a valid tag ID
tag.min.length=4

# Whether to add E2 prefix to EPCs (UHF RFID Gen2 standard)
tag.add.e2.prefix=true

# POS Mode Settings
# Tag TTL (Time-To-Live) in seconds
# After this time, the same tag can be sent again
# Set to 0 to send each tag only once (not recommended for POS)
# Recommended: 3-10 seconds for POS transactions
tag.ttl.seconds=5

# Auto-reset inactivity timeout in seconds
# Automatically clear all seen tags after this period of no scan activity
# This simulates "next customer" - ready for new transaction
# Set to 0 to disable auto-reset
# Recommended: 20-60 seconds for POS
auto.reset.inactivity.seconds=30
